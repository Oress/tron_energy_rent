openapi: 3.0.3
info:
  title: Nrgyrent Dashboard API
  description: Contract for the packaged operational dashboard. Financial amount currencies are documented per field.
  version: 1.0.0
servers:
  - url: /
paths:
  /api/v1/dashboard/filters/users:
    get:
      tags: [Filters]
      operationId: getFilterUsers
      summary: List users available to the dashboard filter
      responses:
        '200':
          description: User filter options
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FilterOption'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/dashboard/filters/groups:
    get:
      tags: [Filters]
      operationId: getFilterGroups
      summary: List groups available to the dashboard filter
      responses:
        '200':
          description: Group filter options
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FilterOption'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/dashboard/orders:
    get:
      tags: [Orders]
      operationId: getOrders
      summary: Return one page of orders
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
      responses:
        '200':
          description: Orders page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/dashboard/user-profits:
    get:
      tags: [UserProfit]
      operationId: getUserProfits
      summary: Return one page of user profit rows
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
      responses:
        '200':
          description: User profit page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfitPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/dashboard/deposits:
    get:
      tags: [Deposits]
      operationId: getDeposits
      summary: Return one page of deposits
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
      responses:
        '200':
          description: Deposits page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepositPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/dashboard/general-statistics:
    get:
      tags: [GeneralStatistics]
      operationId: getGeneralStatistics
      summary: Return dashboard-wide financial statistics
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
      responses:
        '200':
          description: General statistics for the selected conditions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralStatistics'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/dashboard/referral-system:
    get:
      tags: [ReferralSystem]
      operationId: getReferralSystem
      summary: Return one page of referral relationships and payments
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
      responses:
        '200':
          description: Referral system page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferralSystemPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/dashboard/referral-program-payments:
    get:
      tags: [ReferralProgramPayments]
      operationId: getReferralProgramPayments
      summary: Return one page of referral program payments
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
      responses:
        '200':
          description: Referral program payments page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferralProgramPaymentPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
components:
  parameters:
    Page:
      name: page
      in: query
      description: Zero-based page index.
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      description: Requested number of rows per page.
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 200
        default: 20
    UserId:
      name: userId
      in: query
      description: Optional user filter.
      required: false
      schema:
        type: integer
        format: int64
    GroupId:
      name: groupId
      in: query
      description: Optional group filter. Combined with userId using intersection semantics.
      required: false
      schema:
        type: integer
        format: int64
    DateFrom:
      name: dateFrom
      in: query
      description: Inclusive start date.
      required: false
      schema:
        type: string
        format: date
    DateTo:
      name: dateTo
      in: query
      description: Inclusive end date.
      required: false
      schema:
        type: string
        format: date
  responses:
    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    FilterOption:
      type: object
      additionalProperties: false
      required: [id, label]
      properties:
        id:
          type: integer
          format: int64
        label:
          type: string
    OrderRow:
      type: object
      additionalProperties: false
      description: One row of the Orders report. Financial fields are decimal TRX.
      required: [id, date, login, name, balanceType, transactionsCount, totalEnergy, tariff, provider, commission, income, referralDeductions, referralDeductionsRemainder, profit, walletActivated, status, recipient, orderNumber, transaction]
      properties:
        id:
          type: integer
          format: int64
        date:
          type: string
          format: date-time
        login:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        balanceType:
          type: string
        transactionsCount:
          type: integer
          format: int32
        totalEnergy:
          type: integer
          format: int64
        tariff:
          type: string
          nullable: true
        provider:
          type: string
          nullable: true
        commission:
          type: number
          description: Commission in decimal TRX.
        income:
          type: number
          description: Income in decimal TRX.
        referralDeductions:
          type: number
          description: Referral deductions in decimal TRX.
        referralDeductionsRemainder:
          type: number
          description: Referral deduction remainder in decimal TRX.
        profit:
          type: number
          description: Profit in decimal TRX.
        walletActivated:
          type: boolean
        status:
          type: string
        recipient:
          type: string
          nullable: true
        orderNumber:
          type: string
          nullable: true
        transaction:
          type: string
          nullable: true
    UserProfitRow:
      type: object
      additionalProperties: false
      description: One row of the User Profit report. Financial fields are decimal TRX.
      required: [joinedAt, referral, balanceType, groupLogin, name, profit, tariff, availableBalance, income, itrxCommission, referralDeductions, manualAdjustments]
      properties:
        joinedAt:
          type: string
          format: date-time
          nullable: true
        referral:
          type: string
          nullable: true
        balanceType:
          type: string
        groupLogin:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        profit:
          type: number
          description: Profit in decimal TRX.
        tariff:
          type: string
          nullable: true
        availableBalance:
          type: number
          description: Available balance in decimal TRX.
        income:
          type: number
          description: Income in decimal TRX.
        itrxCommission:
          type: number
          description: ITRX commission in decimal TRX.
        referralDeductions:
          type: number
          description: Referral deductions in decimal TRX.
        manualAdjustments:
          type: number
          description: Manual balance adjustments in decimal TRX.
    DepositRow:
      type: object
      additionalProperties: false
      description: One row of the Deposits report. Amounts are decimal TRX and USDT.
      required: [id, date, trxAmount, usdtAmount, balanceType, groupLogin, name, accountActivated, depositWallet, sender, status, transaction]
      properties:
        id:
          type: integer
          format: int64
        date:
          type: string
          format: date-time
        trxAmount:
          type: number
          description: Deposit amount in decimal TRX.
        usdtAmount:
          type: number
          description: Deposit amount in decimal USDT.
        balanceType:
          type: string
        groupLogin:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        accountActivated:
          type: boolean
        depositWallet:
          type: string
          nullable: true
        sender:
          type: string
          nullable: true
        status:
          type: string
        transaction:
          type: string
          nullable: true
    GeneralStatistics:
      type: object
      additionalProperties: false
      description: General dashboard statistics. All values are decimal TRX.
      required: [periodProfit, bybitBalance, periodAmlProfit, pendingReferralPayments, itrxBalance, catfeeBalance, trxxBalance, nettsBalance, sweepWalletsBalance, userBalancesTotal, periodReferralPayments, periodReferralProgramRemainder, depositsTotal, periodProviderCommission, newField]
      properties:
        periodProfit:
          type: number
          description: Profit for the selected period in decimal TRX.
        bybitBalance:
          type: number
          description: Current Bybit balance in decimal TRX.
        periodAmlProfit:
          type: number
          description: AML profit for the selected period in decimal TRX.
        pendingReferralPayments:
          type: number
          description: Pending referral payments in decimal TRX.
        itrxBalance:
          type: number
          description: Current itrx.io balance in decimal TRX.
        catfeeBalance:
          type: number
          description: Current catfee.io balance in decimal TRX.
        trxxBalance:
          type: number
          description: Current trxx.io balance in decimal TRX.
        nettsBalance:
          type: number
          description: Current netts.io balance in decimal TRX.
        sweepWalletsBalance:
          type: number
          description: Sweep wallets balance in decimal TRX.
        userBalancesTotal:
          type: number
          description: Sum of user balances in decimal TRX.
        periodReferralPayments:
          type: number
          description: Referral payments for the selected period in decimal TRX.
        periodReferralProgramRemainder:
          type: number
          description: Referral program remainder for the selected period in decimal TRX.
        depositsTotal:
          type: number
          description: Sum of deposits in decimal TRX.
        periodProviderCommission:
          type: number
          description: Provider commission for the selected period in decimal TRX.
        newField:
          type: number
          description: New field value in decimal TRX.
    ReferralSystemRow:
      type: object
      additionalProperties: false
      description: One row of the Referral System report. Payment amounts are decimal TRX.
      required: [referrer, referral, program, pendingPayment, paidForPeriod, paidTotal]
      properties:
        referrer:
          type: string
          nullable: true
        referral:
          type: string
          nullable: true
        program:
          type: string
          nullable: true
        pendingPayment:
          type: number
          description: Pending payment in decimal TRX.
        paidForPeriod:
          type: number
          description: Amount paid for the selected period in decimal TRX.
        paidTotal:
          type: number
          description: Total amount paid in decimal TRX.
    ReferralProgramPaymentRow:
      type: object
      additionalProperties: false
      description: One referral program payment. Amount is decimal TRX.
      required: [user, amount, date]
      properties:
        user:
          type: string
          nullable: true
        amount:
          type: number
          description: Payment amount in decimal TRX.
        date:
          type: string
          format: date-time
    OrderPage:
      type: object
      additionalProperties: false
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/OrderRow'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
    UserProfitPage:
      type: object
      additionalProperties: false
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/UserProfitRow'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
    DepositPage:
      type: object
      additionalProperties: false
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/DepositRow'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
    ReferralSystemPage:
      type: object
      additionalProperties: false
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ReferralSystemRow'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
    ReferralProgramPaymentPage:
      type: object
      additionalProperties: false
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ReferralProgramPaymentRow'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
    ApiError:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
