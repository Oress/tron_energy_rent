      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AmlCheckRowPage'
  /v1/filter/users:
    get:
      tags: [Filter]
      operationId: getFilterUsers
      summary: Options for the global filter's user selector
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FilterUserDto'
  /v1/filter/groups:
    get:
      tags: [Filter]
      operationId: getFilterGroups
      summary: Options for the global filter's group selector
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FilterGroupDto'
  /v1/statistics/overall:
    get:
      tags: [Statistics]
      operationId: getOverallStatistics
      summary: Overall statistics (Блок "Общая статистика")
      parameters:
        - name: dateFrom
          in: query
          required: false
          description: Global filter — period start (inclusive, local date)
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          required: false
          description: Global filter — period end (inclusive, local date)
          schema:
