            application/json:
              schema:
                $ref: '#/components/schemas/OverallStatisticsDto'
components:
  schemas:
    OrderRowDto:
      type: object
      description: Row of the "Заказы" report table.
      properties:
        id:
          type: integer
          format: int64
        date:
          type: string
          format: date-time
        login:
          type: string
        name:
          type: string
        balanceType:
          type: string
        transactionsCount:
          type: integer
          format: int32
        totalEnergy:
          type: integer
          format: int64
        tariff:
          type: string
        provider:
          type: string
        commission:
          type: number
          format: double
        income:
          type: number
          format: double
        referralDeductions:
          type: number
          format: double
        referralDeductionsRemainder:
          type: number
          format: double
        profit:
          type: number
          format: double
        walletActivated:
          type: boolean
        status:
          type: string
        recipient:
          type: string
        orderNumber:
          type: string
        transaction:
          type: string
    OrderRowPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/OrderRowDto'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
    UserProfitRowDto:
      type: object
      description: Row of the "Прибыль по пользователям" report table.
      properties:
        joinedAt:
          type: string
          format: date-time
        referral:
          type: string
        balanceType:
          type: string
        groupLogin:
          type: string
        name:
          type: string
        profit:
          type: number
          format: double
        tariff:
          type: string
        availableBalance:
          type: number
          format: double
        income:
          type: number
          format: double
        itrxCommission:
          type: number
          format: double
        referralDeductions:
          type: number
          format: double
        manualAdjustments:
          type: number
          format: double
    UserProfitPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/UserProfitRowDto'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
    DepositRowDto:
      type: object
      description: Row of the "Депозиты" report table.
      properties:
        id:
          type: integer
          format: int64
        date:
          type: string
          format: date-time
        trx:
          type: number
          format: double
        usdt:
          type: number
          format: double
        balanceType:
          type: string
        groupLogin:
          type: string
        name:
          type: string
        accountActivated:
          type: boolean
        depositWallet:
          type: string
        sender:
          type: string
        status:
          type: string
        transaction:
          type: string
    DepositRowPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/DepositRowDto'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
    OverallStatisticsDto:
      type: object
      description: Общая статистика — label/value metrics block.
      properties:
        profitPeriod:
          type: number
          format: double
          description: Прибыль (за период)
        bybitBalance:
          type: number
          format: double
          description: Баланс Bybit
        amlProfitPeriod:
          type: number
          format: double
          description: AML прибыль (за период)
        pendingReferralPayouts:
          type: number
          format: double
          description: Реф. выплаты в ожидании
        itrxBalance:
          type: number
          format: double
          description: Баланс itrx.io
        catfeeBalance:
          type: number
          format: double
          description: Баланс catfee.io
        trxxBalance:
          type: number
          format: double
          description: Баланс trxx.io
        nettsBalance:
          type: number
          format: double
          description: Баланс netts.io
        sweepWalletsBalance:
          type: number
          format: double
          description: Баланс свип кошельков
        usersBalanceSum:
          type: number
          format: double
          description: Сумма балансов юзеров
        referralPayoutsPeriod:
          type: number
          format: double
          description: Реф. выплаты (за период)
        referralProgramsRemainder:
          type: number
          format: double
          description: Остаток от реф. программ (за период)
        depositsSum:
          type: number
          format: double
          description: Сумма депозитов
        providersCommissionPeriod:
          type: number
          format: double
          description: Комиссия поставщиков (период)
        newField:
          type: string
          description: Новое Поле (резерв)
    ReferralSystemRowDto:
      type: object
      description: Row of the "Реферальная система" report table.
      properties:
        referrer:
          type: string
        referral:
          type: string
        program:
          type: string
        pendingPayout:
          type: number
          format: double
        paidPeriod:
          type: number
          format: double
        paidTotal:
          type: number
          format: double
    ReferralSystemRowPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ReferralSystemRowDto'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
    ReferralPayoutRowDto:
      type: object
      description: Row of the "Выплаты по реф программам" report table.
      properties:
        user:
          type: string
        amount:
          type: number
          format: double
        date:
          type: string
          format: date-time
    ReferralPayoutRowPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ReferralPayoutRowDto'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
    WithdrawalRowDto:
      type: object
      description: Row of the "Выводы Пользователей" report table.
      properties:
        id:
          type: integer
          format: int64
        date:
          type: string
          format: date-time
        nickname:
          type: string
        name:
          type: string
        balanceType:
          type: string
        amount:
          type: number
          format: double
        commission:
          type: number
          format: double
        status:
          type: string
        recipient:
          type: string
        transaction:
          type: string
    WithdrawalRowPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/WithdrawalRowDto'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
    AmlCheckRowDto:
      type: object
      description: Row of the "AML проверки" report table.
      properties:
        id:
          type: integer
          format: int64
        date:
          type: string
          format: date-time
        nickname:
          type: string
        name:
          type: string
        balanceType:
          type: string
        provider:
          type: string
        tariff:
          type: string
        checkWallet:
          type: string
        amount:
          type: number
          format: double
        profit:
          type: number
          format: double
        commission:
          type: number
          format: double
        status:
          type: string
        internalStatus:
          type: string
        orderNumber:
          type: string
    AmlCheckRowPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/AmlCheckRowDto'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
    FilterUserDto:
      type: object
      description: Option of the global filter's user selector.
      properties:
        id:
          type: integer
          format: int64
        label:
          type: string
    FilterGroupDto:
      type: object
      description: Option of the global filter's group selector.
      properties:
        id:
          type: integer
          format: int64
        label:
          type: string
