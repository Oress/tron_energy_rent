openapi: 3.0.3
info:
  title: NrgyRent Server API
  description: |
    Contract between the nrgyrent Spring Boot server and the Angular dashboard.

    Conventions:
    - All endpoints live under /api/v1/... on the server.
    - Pagination is page/size (0-based page) and every list endpoint returns a
      Page envelope with content/page/size/totalElements.
    - Keep operationIds stable — they determine the generated client method names.
  version: 0.2.0
servers:
  - url: /api
    description: Same-origin (served from the Spring Boot jar)
tags:
  - name: Order
  - name: Profit
  - name: Deposit
  - name: Statistics
  - name: Referral
  - name: Withdrawal
  - name: AmlCheck
  - name: Filter
paths:
  /v1/orders:
    get:
      tags: [Order]
      operationId: getOrders
      summary: Paginated orders report rows (Таблица "Заказы")
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            format: int32
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            format: int32
            default: 20
        - name: userId
          in: query
          required: false
          description: Global filter — user id
          schema:
            type: integer
            format: int64
        - name: groupId
          in: query
          required: false
          description: Global filter — group id
          schema:
            type: integer
            format: int64
        - name: dateFrom
          in: query
          required: false
          description: Global filter — period start (inclusive, local date)
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          required: false
          description: Global filter — period end (inclusive, local date)
          schema:
            type: string
            format: date
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderRowPage'
  /v1/profit-by-user:
    get:
      tags: [Profit]
      operationId: getUserProfit
      summary: Paginated profit-by-user report rows (Таблица "Прибыль по пользователям")
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            format: int32
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            format: int32
            default: 20
        - name: userId
          in: query
          required: false
          description: Global filter — user id
          schema:
            type: integer
            format: int64
        - name: groupId
          in: query
          required: false
          description: Global filter — group id
          schema:
            type: integer
            format: int64
        - name: dateFrom
          in: query
          required: false
          description: Global filter — period start (inclusive, local date)
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          required: false
          description: Global filter — period end (inclusive, local date)
          schema:
            type: string
            format: date
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfitPage'
  /v1/deposits:
    get:
      tags: [Deposit]
      operationId: getDeposits
      summary: Paginated deposits report rows (Таблица "Депозиты")
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            format: int32
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            format: int32
            default: 20
        - name: userId
          in: query
          required: false
          description: Global filter — user id
          schema:
            type: integer
            format: int64
        - name: groupId
          in: query
          required: false
          description: Global filter — group id
          schema:
            type: integer
            format: int64
        - name: dateFrom
          in: query
          required: false
          description: Global filter — period start (inclusive, local date)
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          required: false
          description: Global filter — period end (inclusive, local date)
          schema:
            type: string
            format: date
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepositRowPage'
  /v1/referral-system:
    get:
      tags: [Referral]
      operationId: getReferralSystem
      summary: Paginated referral-system report rows (Таблица "Реферальная система")
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            format: int32
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            format: int32
            default: 20
        - name: userId
          in: query
          required: false
          description: Global filter — user id
          schema:
            type: integer
            format: int64
        - name: groupId
          in: query
          required: false
          description: Global filter — group id
          schema:
            type: integer
            format: int64
        - name: dateFrom
          in: query
          required: false
          description: Global filter — period start (inclusive, local date)
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          required: false
          description: Global filter — period end (inclusive, local date)
          schema:
            type: string
            format: date
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferralSystemRowPage'
  /v1/referral-payouts:
    get:
      tags: [Referral]
      operationId: getReferralPayouts
      summary: Paginated referral payouts report rows (Таблица "Выплаты по реф программам")
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            format: int32
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            format: int32
            default: 20
        - name: userId
          in: query
          required: false
          description: Global filter — user id
          schema:
            type: integer
            format: int64
        - name: groupId
          in: query
          required: false
          description: Global filter — group id
          schema:
            type: integer
            format: int64
        - name: dateFrom
          in: query
          required: false
          description: Global filter — period start (inclusive, local date)
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          required: false
          description: Global filter — period end (inclusive, local date)
          schema:
            type: string
            format: date
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferralPayoutRowPage'
  /v1/withdrawals:
    get:
      tags: [Withdrawal]
      operationId: getWithdrawals
      summary: Paginated user withdrawals report rows (Таблица "Выводы Пользователей")
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            format: int32
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            format: int32
            default: 20
        - name: userId
          in: query
          required: false
          description: Global filter — user id
          schema:
            type: integer
            format: int64
        - name: groupId
          in: query
          required: false
          description: Global filter — group id
          schema:
            type: integer
            format: int64
        - name: dateFrom
          in: query
          required: false
          description: Global filter — period start (inclusive, local date)
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          required: false
          description: Global filter — period end (inclusive, local date)
          schema:
            type: string
            format: date
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WithdrawalRowPage'
  /v1/aml-checks:
    get:
      tags: [AmlCheck]
      operationId: getAmlChecks
      summary: Paginated AML checks report rows (Таблица "AML проверки")
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            format: int32
            default: 0
        - name: size
          in: query
          schema:
            type: integer
