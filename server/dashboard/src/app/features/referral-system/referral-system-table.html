<section class="report-section">
  <h3 class="report-title">Реферальная система</h3>

  <div class="table-wrap">
    <p-table
      [value]="rows()"
      [lazy]="true"
      [loading]="loading()"
      [paginator]="true"
      [rows]="pageSize()"
      [first]="first()"
      [totalRecords]="total()"
      [rowsPerPageOptions]="[10, 20, 50]"
      [showCurrentPageReport]="true"
      currentPageReportTemplate="{first}–{last} из {totalRecords}"
      (onPage)="onPage($event)"
      size="small"
      [stripedRows]="true"
      styleClass="data-table referral-system-table"
    >
      <ng-template #header>
        <tr>
          <th>Реферер</th>
          <th>Реферал</th>
          <th>Программа</th>
          <th>Выплата в ожидании</th>
          <th>Выплачено за период</th>
          <th>Выплачено всего</th>
        </tr>
      </ng-template>

      <ng-template #body let-row>
        <tr>
          <td>{{ row.referrer }}</td>
          <td>{{ row.referral }}</td>
          <td>{{ row.program }}</td>
          <td class="num">{{ row.pendingPayout | formatUsdt }}</td>
          <td class="num">{{ row.paidPeriod | formatUsdt }}</td>
          <td class="num">{{ row.paidTotal | formatUsdt }}</td>
        </tr>
      </ng-template>

      <ng-template #emptymessage>
        <tr>
          <td colspan="6">Нет данных.</td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</section>
