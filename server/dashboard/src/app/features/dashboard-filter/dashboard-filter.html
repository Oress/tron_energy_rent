<section
  class="mb-5 rounded-[5px] border border-[var(--ledger-line)] border-l-4 border-l-[var(--ledger-signal)] bg-white/95 p-4 shadow-[0_8px_24px_rgb(16_27_43_/_5%)] sm:p-5"
  aria-labelledby="filter-title"
>
  <div class="mb-4 flex flex-col gap-2 sm:flex-row sm:items-end sm:justify-between">
    <div>
      <h3 id="filter-title" class="m-0 font-[var(--font-display)] text-lg font-semibold">Фильтр</h3>
    </div>
  </div>

  <div class="grid gap-3.5 sm:grid-cols-2 xl:grid-cols-[1.2fr_1.2fr_1fr_1fr]">
    <label class="grid min-w-0 gap-1.5">
      <span class="text-[0.72rem] font-semibold uppercase tracking-[0.025em] text-[var(--ledger-slate)]">Пользователь</span>
      <select
        class="min-h-11 w-full rounded border border-[#b8cbd4] bg-white px-3 py-2.5 text-sm text-[var(--ledger-ink)] transition-colors hover:border-[#83aab9] focus:border-[var(--ledger-rail)] disabled:cursor-not-allowed disabled:bg-[#eef3f5]"
        [(ngModel)]="userId"
        [disabled]="usersLoading()"
      >
        <option [ngValue]="null">{{ usersLoading() ? 'Загрузка…' : 'Все пользователи' }}</option>
        @for (user of users(); track user.id) {
          <option [ngValue]="user.id">{{ user.label }}</option>
        }
      </select>
      @if (usersError()) {
        <small class="text-[0.68rem] leading-snug text-[var(--ledger-warning)]">Список недоступен — можно применить остальные условия.</small>
      }
    </label>

    <label class="grid min-w-0 gap-1.5">
      <span class="text-[0.72rem] font-semibold uppercase tracking-[0.025em] text-[var(--ledger-slate)]">Группа</span>
      <select
        class="min-h-11 w-full rounded border border-[#b8cbd4] bg-white px-3 py-2.5 text-sm text-[var(--ledger-ink)] transition-colors hover:border-[#83aab9] focus:border-[var(--ledger-rail)] disabled:cursor-not-allowed disabled:bg-[#eef3f5]"
        [(ngModel)]="groupId"
        [disabled]="groupsLoading()"
      >
        <option [ngValue]="null">{{ groupsLoading() ? 'Загрузка…' : 'Все группы' }}</option>
        @for (group of groups(); track group.id) {
          <option [ngValue]="group.id">{{ group.label }}</option>
        }
      </select>
      @if (groupsError()) {
        <small class="text-[0.68rem] leading-snug text-[var(--ledger-warning)]">Список недоступен — можно применить остальные условия.</small>
      }
    </label>

    <label class="grid min-w-0 gap-1.5">
      <span class="text-[0.72rem] font-semibold uppercase tracking-[0.025em] text-[var(--ledger-slate)]">Дата с</span>
      <input
        type="date"
        class="min-h-11 w-full rounded border border-[#b8cbd4] bg-white px-3 py-2.5 text-sm text-[var(--ledger-ink)] transition-colors hover:border-[#83aab9] focus:border-[var(--ledger-rail)]"
        [(ngModel)]="dateFrom"
      />
    </label>

    <label class="grid min-w-0 gap-1.5">
      <span class="text-[0.72rem] font-semibold uppercase tracking-[0.025em] text-[var(--ledger-slate)]">Дата по</span>
      <input
        type="date"
        class="min-h-11 w-full rounded border border-[#b8cbd4] bg-white px-3 py-2.5 text-sm text-[var(--ledger-ink)] transition-colors hover:border-[#83aab9] focus:border-[var(--ledger-rail)]"
        [(ngModel)]="dateTo"
      />
    </label>
  </div>

  @if (dateError()) {
    <p class="mt-3 mb-0 text-xs text-[#a23838]" role="alert">{{ dateError() }}</p>
  }

  <div class="mt-4 grid gap-2.5 sm:flex sm:justify-end">
    <button
      type="button"
      class="min-h-11 rounded bg-[var(--ledger-rail)] px-4 py-2.5 text-sm font-bold text-white shadow-sm transition-colors hover:bg-[#0e6379] active:bg-[#0b5366]"
      (click)="apply()"
    >
      Применить
    </button>
    <button
      type="button"
      class="min-h-11 rounded border border-[#b8cbd4] bg-white px-4 py-2.5 text-sm font-bold text-[var(--ledger-ink)] transition-colors hover:border-[var(--ledger-rail)] hover:text-[var(--ledger-rail)]"
      (click)="reset()"
    >
      Сбросить
    </button>
  </div>
</section>
