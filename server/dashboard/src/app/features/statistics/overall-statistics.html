<section class="report-section">
  <h3 class="report-title">Общая статистика</h3>

  @if (loading()) {
    <p class="muted">Загрузка…</p>
  } @else {
    <!-- Mobile-first: 1 column on phones, 2 columns from sm. -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-8 gap-y-4">
      @for (item of items(); track item.label) {
        <div class="stat-item">
          <span class="stat-label">{{ item.label }}</span>
          <span class="stat-value">{{ item.value | formatUsdt : 2 : '' }}</span>
        </div>
      }
    </div>
  }
</section>
