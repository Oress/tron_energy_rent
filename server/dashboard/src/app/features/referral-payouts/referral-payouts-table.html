<section class="report-section">
  <h3 class="report-title">Выплаты по реф программам</h3>

  <div class="table-wrap">
    <p-table
      [value]="rows()"
      [lazy]="true"
      [loading]="loading()"
      [paginator]="true"
      [rows]="pageSize()"
      [first]="first()"
      [totalRecords]="total()"
      [rowsPerPageOptions]="[10, 20, 50]"
      [showCurrentPageReport]="true"
      currentPageReportTemplate="{first}–{last} из {totalRecords}"
      (onPage)="onPage($event)"
      size="small"
      [stripedRows]="true"
      styleClass="data-table"
    >
      <ng-template #header>
        <tr>
          <th>Пользователь</th>
          <th>Сумма</th>
          <th>Дата</th>
        </tr>
      </ng-template>

      <ng-template #body let-row>
        <tr>
          <td>{{ row.user }}</td>
          <td class="num">{{ row.amount | formatUsdt }}</td>
          <td>{{ row.date | date: 'yyyy-MM-dd HH:mm' }}</td>
        </tr>
      </ng-template>

      <ng-template #emptymessage>
        <tr>
          <td colspan="3">Нет данных.</td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</section>
