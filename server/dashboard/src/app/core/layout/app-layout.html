<!-- Mobile off-canvas navigation -->
<p-drawer
  [(visible)]="sidebarVisible"
  position="left"
  [showCloseIcon]="false"
  [style]="{ width: '85vw', maxWidth: '20rem' }"
  styleClass="nav-drawer"
>
  <div class="drawer-content">
    <div class="brand">⚡ NrgyRent</div>
    <p-menu [model]="navItems" styleClass="nav-menu" />
    <div class="drawer-footer">
      v{{ version }}<span class="muted"> · {{ gitHash }}</span>
    </div>
  </div>
</p-drawer>

<div class="layout">
  <!-- Persistent sidebar (desktop only) -->
  <aside class="sidebar">
    <div class="brand">⚡ NrgyRent</div>
    <p-menu [model]="navItems" styleClass="nav-menu" />
    <div class="sidebar-footer">
      v{{ version }}<span class="muted"> · {{ gitHash }}</span>
    </div>
  </aside>

  <div class="content">
    <header class="topbar">
      <p-button
        class="menu-button"
        icon="pi pi-bars"
        text
        rounded
        severity="secondary"
        ariaLabel="Open navigation menu"
        (onClick)="sidebarVisible.set(true)"
      />
      <div class="topbar-brand">NrgyRent</div>
      <span class="topbar-version">v{{ version }}</span>
    </header>

    <main class="main">
      <router-outlet />
    </main>
  </div>
</div>

<p-toast position="bottom-center" />
